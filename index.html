<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Working Title</title>
    <!-- CrazyGames HTML5 SDK v3: in <head>, before game code (docs.crazygames.com/sdk/intro).
         `vite dev` swaps it for dev/mock-crazygames-sdk.js unless ?realsdk=1. -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8d93dc; }
      /* CG-TECH-012: stop the tablet magnifier and selection menus. */
      body {
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; overflow: hidden; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #boot { position: absolute; inset: 0; display: grid; place-items: center; background: #8d93dc; z-index: 50; transition: opacity .35s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot i { display: block; width: min(40vw, 260px); height: 10px; border-radius: 6px; background: #ffffff55; overflow: hidden; }
      #boot i::after { content: ""; display: block; height: 100%; width: 40%; border-radius: 6px; background: #fff; animation: boot 1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" tabindex="-1"></canvas>
      <div id="ui"></div>
      <div id="boot"><i></i></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
